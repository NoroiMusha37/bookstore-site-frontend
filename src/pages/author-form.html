<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Author Form - Bookstore</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/layout.css">
</head>
<body>
    <main class="container" style="max-width: 600px; margin-top: 4rem;">
        <div class="card" style="padding: 2.5rem;">
            <div class="flex-between" style="border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; margin-bottom: 2rem;">
                <h1 id="page-title">Author</h1>
                <a href="authors.html" class="btn btn-secondary">Cancel</a>
            </div>
            
            <div id="error-container"></div>
            
            <form id="entity-form" style="display: none;">
                <div class="form-group">
                    <label class="form-label">Name *</label>
                    <input type="text" name="name" id="field-name" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Biography</label>
                    <textarea name="bio" id="field-bio" rows="6" class="form-control"></textarea>
                </div>
                
                <button type="submit" id="submit-btn" class="btn btn-primary btn-block">Save</button>
            </form>
        </div>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/pages/author-form.js"></script>
</body>
</html>
