<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Bookstore</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/layout.css">
</head>
<body>

<main class="container">
    <div class="flex-between" style="margin-bottom: 2rem;">
        <h1>Your Cart</h1>
        <button id="clear-cart-btn" class="btn btn-danger" style="display: none;">Clear Cart</button>
    </div>
    
    <div style="display: grid; grid-template-columns: 1fr 300px; gap: 2rem; align-items: start;">
        <div id="cart-items" class="grid" style="grid-template-columns: 1fr; gap: 1rem;">
            <!-- Cart items will be rendered here -->
        </div>
        
        <aside class="filters-sidebar" style="background: var(--card-bg); padding: 1.5rem; border-radius: var(--radius); border: 1px solid var(--border-color); display: none;" id="checkout-sidebar">
            <h3 style="margin-bottom: 1rem;">Order Summary</h3>
            <div style="margin-bottom: 1rem; display: flex; justify-content: space-between;">
                <span style="color: var(--text-muted);">Total</span>
                <strong id="cart-total" style="font-size: 1.25rem;">$0.00</strong>
            </div>
            
            <button id="checkout-btn" style="width: 100%; padding: 0.75rem; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: background 0.3s;">Checkout Now</button>
        </aside>
    </div>
</main>

    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/pages/cart.js"></script>
</body>
</html>
